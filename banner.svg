  </g>
  <g fill="#A78BFA">
    <circle class="pulse d3" cx="1070" cy="90" r="8"/><circle class="pulse d4" cx="1070" cy="160" r="8"/><circle class="pulse d1" cx="1070" cy="230" r="8"/>
  </g>
  <circle class="pulse d2" cx="1150" cy="160" r="11" fill="#F472B6"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Omar Ahmed Ramadan, AI and Data Science Student" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0F2A43"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <style>
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .d1 { animation-delay: 0s; }
      .d2 { animation-delay: 0.5s; }
      .d3 { animation-delay: 1s; }
      .d4 { animation-delay: 1.5s; }
      @keyframes pulse { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.35); } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)"/>

  <text x="60" y="95" font-family="'Segoe UI', Arial, sans-serif" font-size="18" letter-spacing="6" fill="#67E8F9">HELLO, I'M</text>
  <text x="60" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="68" font-weight="800" fill="url(#name)">Omar Ahmed Ramadan</text>
  <text x="62" y="212" font-family="'Segoe UI', Arial, sans-serif" font-size="27" font-weight="600" letter-spacing="5" fill="#E2E8F0">AI &amp; DATA SCIENCE STUDENT</text>
  <text x="62" y="254" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#67E8F9">Machine Learning  ·  Deep Learning  ·  NLP  ·  Data Engineering</text>
  <text x="62" y="288" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#94A3B8">SUTech Elsewedy University  ·  Cairo, Egypt</text>

  <g stroke="#22D3EE" stroke-opacity="0.28" stroke-width="1.4">
    <line x1="850" y1="90" x2="960" y2="60"/><line x1="850" y1="90" x2="960" y2="130"/><line x1="850" y1="90" x2="960" y2="200"/><line x1="850" y1="90" x2="960" y2="270"/>
    <line x1="850" y1="160" x2="960" y2="60"/><line x1="850" y1="160" x2="960" y2="130"/><line x1="850" y1="160" x2="960" y2="200"/><line x1="850" y1="160" x2="960" y2="270"/>
    <line x1="850" y1="230" x2="960" y2="60"/><line x1="850" y1="230" x2="960" y2="130"/><line x1="850" y1="230" x2="960" y2="200"/><line x1="850" y1="230" x2="960" y2="270"/>
    <line x1="960" y1="60" x2="1070" y2="90"/><line x1="960" y1="60" x2="1070" y2="160"/><line x1="960" y1="60" x2="1070" y2="230"/>
    <line x1="960" y1="130" x2="1070" y2="90"/><line x1="960" y1="130" x2="1070" y2="160"/><line x1="960" y1="130" x2="1070" y2="230"/>
    <line x1="960" y1="200" x2="1070" y2="90"/><line x1="960" y1="200" x2="1070" y2="160"/><line x1="960" y1="200" x2="1070" y2="230"/>
    <line x1="960" y1="270" x2="1070" y2="90"/><line x1="960" y1="270" x2="1070" y2="160"/><line x1="960" y1="270" x2="1070" y2="230"/>
    <line x1="1070" y1="90" x2="1150" y2="160"/><line x1="1070" y1="160" x2="1150" y2="160"/><line x1="1070" y1="230" x2="1150" y2="160"/>
  </g>

  <g fill="#22D3EE">
